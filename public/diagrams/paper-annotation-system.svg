<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="880" height="440" fill="#f7f8fa"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ffa94d"/></marker>
  </defs>

  <text x="120" y="30" text-anchor="middle" font-size="12" fill="#8b949e" letter-spacing="1">输入</text>
  <text x="430" y="30" text-anchor="middle" font-size="12" fill="#8b949e" letter-spacing="1">导入管线（ExcelImportService）</text>
  <text x="742" y="30" text-anchor="middle" font-size="12" fill="#8b949e" letter-spacing="1">输出</text>

  <!-- 输入 -->
  <rect x="24" y="48" width="192" height="120" rx="8" fill="#fff" stroke="#d8dee6"/>
  <text x="120" y="72" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">中文期刊 Excel</text>
  <text x="120" y="96" text-anchor="middle" font-size="11" fill="#5b6470">标题 / 作者 / 分类 / 期刊</text>
  <text x="120" y="114" text-anchor="middle" font-size="11" fill="#5b6470">摘要 / 关键字 / URL / _id</text>
  <text x="120" y="138" text-anchor="middle" font-size="10.5" fill="#8b949e">分类列含《》</text>
  <text x="120" y="156" text-anchor="middle" font-size="10.5" fill="#8b949e">.xls 走 HSSF，.xlsx 走 XSSF</text>

  <rect x="24" y="184" width="192" height="120" rx="8" fill="#fff" stroke="#d8dee6"/>
  <text x="120" y="208" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">英文期刊 Excel</text>
  <text x="120" y="232" text-anchor="middle" font-size="11" fill="#5b6470">多出 doi / 年月 两列</text>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#5b6470">期刊名为全名</text>
  <text x="120" y="274" text-anchor="middle" font-size="10.5" fill="#8b949e">分类列不含《》</text>
  <text x="120" y="292" text-anchor="middle" font-size="10.5" fill="#8b949e">兜底：看有无 doi 列</text>

  <rect x="24" y="322" width="192" height="60" rx="8" fill="#fff" stroke="#d8dee6"/>
  <text x="120" y="346" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">目录批量导入</text>
  <text x="120" y="366" text-anchor="middle" font-size="10.5" fill="#8b949e">扫描 .xls / .xlsx 逐个导入</text>

  <!-- 管线 -->
  <rect x="252" y="48" width="356" height="334" rx="8" fill="#fff" stroke="#1f6feb" stroke-width="1.5"/>
  <g font-size="11.5">
    <rect x="270" y="64" width="320" height="44" rx="6" fill="#eef4ff" stroke="#c7dcff"/>
    <text x="430" y="82" text-anchor="middle" font-size="12" fill="#1a1a1a">① 表头按名匹配</text>
    <text x="430" y="99" text-anchor="middle" font-size="10" fill="#5b6470">标题/PaperTitle · 关键字/关键词/Keywords · _id/doi/PaperID</text>

    <rect x="270" y="116" width="320" height="44" rx="6" fill="#eef4ff" stroke="#c7dcff"/>
    <text x="430" y="134" text-anchor="middle" font-size="12" fill="#1a1a1a">② 中英格式识别</text>
    <text x="430" y="151" text-anchor="middle" font-size="10" fill="#5b6470">分类列含《》→ 中文；否则英文</text>

    <rect x="270" y="168" width="320" height="44" rx="6" fill="#eef4ff" stroke="#c7dcff"/>
    <text x="430" y="186" text-anchor="middle" font-size="12" fill="#1a1a1a">③ 行转 Paper + 生成 Content HTML</text>
    <text x="430" y="203" text-anchor="middle" font-size="10" fill="#5b6470">数字单元格 DecimalFormat · 文本 escape · 期刊名去《》</text>

    <rect x="270" y="220" width="320" height="60" rx="6" fill="#fff4e5" stroke="#ffd8a8"/>
    <text x="430" y="238" text-anchor="middle" font-size="12" fill="#1a1a1a">④ 两层去重</text>
    <text x="430" y="255" text-anchor="middle" font-size="10" fill="#5b6470">库内键按集合懒加载一次（投影 4 字段）</text>
    <text x="430" y="270" text-anchor="middle" font-size="10" fill="#5b6470">＋ 批次内 seen（整批未落库，仅查库拦不住）</text>

    <rect x="270" y="288" width="320" height="44" rx="6" fill="#eef4ff" stroke="#c7dcff"/>
    <text x="430" y="306" text-anchor="middle" font-size="12" fill="#1a1a1a">⑤ 按集合分组 → 批量写</text>
    <text x="430" y="323" text-anchor="middle" font-size="10" fill="#5b6470">一个文件可拆进多个集合；单行失败带行号回显</text>

    <rect x="270" y="340" width="320" height="32" rx="6" fill="#f1f8f2" stroke="#c9e6cd"/>
    <text x="430" y="360" text-anchor="middle" font-size="10.5" fill="#2f7d32">判重键 = 标题 + 期刊 + 发表日期 + paperId（不靠 _id 唯一索引）</text>
  </g>

  <!-- 输出 -->
  <rect x="646" y="48" width="210" height="150" rx="8" fill="#fff" stroke="#d8dee6"/>
  <text x="751" y="70" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">MongoDB · 5 个集合</text>
  <text x="751" y="92" text-anchor="middle" font-size="10.5" fill="#5b6470">domestic_papers</text>
  <text x="751" y="110" text-anchor="middle" font-size="10.5" fill="#5b6470">intl_chinese_accounting</text>
  <text x="751" y="128" text-anchor="middle" font-size="10.5" fill="#5b6470">intl_chinese_finance</text>
  <text x="751" y="146" text-anchor="middle" font-size="10.5" fill="#5b6470">intl_accounting</text>
  <text x="751" y="164" text-anchor="middle" font-size="10.5" fill="#5b6470">intl_finance</text>
  <text x="751" y="186" text-anchor="middle" font-size="10" fill="#8b949e">会计 / 金融 × 是否中国相关</text>

  <rect x="646" y="214" width="210" height="86" rx="8" fill="#fff" stroke="#d8dee6"/>
  <text x="751" y="236" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">在线标注</text>
  <text x="751" y="258" text-anchor="middle" font-size="10.5" fill="#5b6470">论文 ↔ 数据库关联</text>
  <text x="751" y="276" text-anchor="middle" font-size="10.5" fill="#5b6470">正文 HTML 预览 / 源码</text>
  <text x="751" y="293" text-anchor="middle" font-size="10" fill="#8b949e">标注结果后补 RelateDBs</text>

  <rect x="646" y="316" width="210" height="66" rx="8" fill="#fff" stroke="#d8dee6"/>
  <text x="751" y="338" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">推送外部 SQL Server</text>
  <text x="751" y="358" text-anchor="middle" font-size="10.5" fill="#5b6470">jTDS · 合并写回</text>
  <text x="751" y="374" text-anchor="middle" font-size="10" fill="#8b949e">有独立的合并测试</text>

  <!-- 箭头 -->
  <line x1="216" y1="108" x2="250" y2="108" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="216" y1="244" x2="250" y2="244" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="216" y1="352" x2="250" y2="352" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="608" y1="150" x2="644" y2="150" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M751,214 L751,200" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M751,316 L751,302" fill="none" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>

  <text x="24" y="410" font-size="10.5" fill="#8b949e">脱敏示意图：集合名与字段名保留结构，公司名、域名、真实库名已替换</text>
  <text x="24" y="428" font-size="10.5" fill="#8b949e">已删除记录（墓碑）同样参与判重：删掉的是抓错的数据，重新导入同一份 Excel 不应复活</text>
</svg>
