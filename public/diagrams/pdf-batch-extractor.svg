<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="880" height="380" fill="#f7f8fa"/>
  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b949e"/></marker>
  </defs>

  <text x="118" y="30" text-anchor="middle" font-size="12" fill="#8b949e" letter-spacing="1">输入</text>
  <text x="330" y="30" text-anchor="middle" font-size="12" fill="#8b949e" letter-spacing="1">pdf_to_html.py</text>
  <text x="560" y="30" text-anchor="middle" font-size="12" fill="#8b949e" letter-spacing="1">html_to_text.py</text>
  <text x="766" y="30" text-anchor="middle" font-size="12" fill="#8b949e" letter-spacing="1">质量门禁</text>

  <rect x="24" y="48" width="188" height="130" rx="8" fill="#fff" stroke="#d8dee6"/>
  <text x="118" y="72" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600">年报类 PDF</text>
  <text x="118" y="96" text-anchor="middle" font-size="10.5" fill="#5b6470">正文与表格混排</text>
  <text x="118" y="116" text-anchor="middle" font-size="10.5" fill="#5b6470">页眉页脚干扰</text>
  <text x="118" y="136" text-anchor="middle" font-size="10.5" fill="#5b6470">封面页与页眉同名</text>
  <text x="118" y="158" text-anchor="middle" font-size="10" fill="#8b949e">240 页 45 秒</text>

  <rect x="24" y="196" width="188" height="86" rx="8" fill="#fff" stroke="#d8dee6"/>
  <text x="118" y="220" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">批量</text>
  <text x="118" y="242" text-anchor="middle" font-size="10.5" fill="#5b6470">run_all.py 一键跑完</text>
  <text x="118" y="262" text-anchor="middle" font-size="10" fill="#8b949e">也支持分两步单独重跑</text>

  <rect x="236" y="48" width="188" height="234" rx="8" fill="#fff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="330" y="72" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">双引擎抽取</text>
  <g font-size="10.5" fill="#5b6470" text-anchor="middle">
    <text x="330" y="96">PyMuPDF 取正文</text>
    <text x="330" y="116">pdfplumber 取表格</text>
    <text x="330" y="140">bbox 去重</text>
    <text x="330" y="160">页眉页脚剔除</text>
    <text x="330" y="184">输出 HTML（可人工核对）</text>
    <text x="330" y="206">逐页对照原文</text>
  </g>
  <text x="330" y="234" text-anchor="middle" font-size="10" fill="#d08428">单一引擎：表格错行或正文被切碎</text>
  <text x="330" y="256" text-anchor="middle" font-size="10" fill="#8b949e">--report 可打印剔除明细</text>

  <rect x="450" y="48" width="220" height="234" rx="8" fill="#fff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="560" y="72" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">HTML → 文本</text>
  <g font-size="10.5" fill="#5b6470" text-anchor="middle">
    <text x="560" y="96">Markdown 表格</text>
    <text x="560" y="116">TSV / plain / kv 可切换</text>
    <text x="560" y="140">页码锚点 &lt;!-- page N --&gt;</text>
    <text x="560" y="160">保留段落结构</text>
  </g>
  <text x="560" y="192" text-anchor="middle" font-size="10" fill="#8b949e">输出 out/txt/xxx.md</text>
  <text x="560" y="214" text-anchor="middle" font-size="10" fill="#8b949e">中间产物在 out/html/</text>

  <rect x="696" y="48" width="160" height="234" rx="8" fill="#fff" stroke="#c9e6cd" stroke-width="1.5"/>
  <text x="776" y="72" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">3 项检查</text>
  <g font-size="10.5" fill="#5b6470" text-anchor="middle">
    <text x="776" y="100">覆盖率</text>
    <text x="776" y="120">0.9707</text>
    <text x="776" y="148">字符密度</text>
    <text x="776" y="176">异常值</text>
    <text x="776" y="196">拦下 152 个</text>
    <text x="776" y="212">「0.00」假值</text>
  </g>
  <text x="776" y="240" text-anchor="middle" font-size="10" fill="#8b949e">不合格不静默通过</text>

  <line x1="212" y1="110" x2="234" y2="110" stroke="#8b949e" stroke-width="1.4" marker-end="url(#d1)"/>
  <line x1="212" y1="240" x2="234" y2="240" stroke="#8b949e" stroke-width="1.4" marker-end="url(#d1)"/>
  <line x1="424" y1="160" x2="448" y2="160" stroke="#8b949e" stroke-width="1.4" marker-end="url(#d1)"/>
  <line x1="670" y1="160" x2="694" y2="160" stroke="#8b949e" stroke-width="1.4" marker-end="url(#d1)"/>

  <text x="24" y="322" font-size="10.5" fill="#8b949e">脱敏示意图：示例 PDF 不随仓库提供，输入目录可自行指定</text>
  <text x="24" y="344" font-size="10.5" fill="#8b949e">带质检环节的抽取比只做转换更重要——无人值守批量处理时，坏结果必须能被发现</text>
</svg>
