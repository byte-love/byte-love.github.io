  <path d="M28.4 23.6v4.8h-4.8" fill="none" stroke="url(#neon)" stroke-opacity="0.55"
        stroke-width="1.1" stroke-linecap="round"/>

  <g filter="url(#glow)">
    <path d="M10.8 9.9 16.6 16 10.8 22.1" fill="none" stroke="url(#neon)" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18.9 22.1H23" fill="none" stroke="#FF3DA6" stroke-width="2.6" stroke-linecap="round"/>
